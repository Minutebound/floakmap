# ── FloakMap — backend only ──────────────────────────────────────────────────
#   cd backend && docker compose up --build              → API only (in-memory DB)
#   cd backend && docker compose --profile db up         → API + Postgres+PostGIS+Timescale + pgAdmin UI
#   cd backend && docker compose --profile demo up       → API + fake vehicle sim
#
# Redis carries the live position fan-out between API pods; with one pod the
# app falls back to an in-process bus.
services:

  redis:
    image: redis:7-alpine
    container_name: floakmap-redis
    command: redis-server --save "" --appendonly no
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: floakmap-api
    ports:
      - "8000:8000"
    # All FLOAK_* settings (jwt secret, database url, cors origins, tuning)
    # come from backend/.env - core/config.py reads them directly via
    # pydantic-settings. Nothing is duplicated or hardcoded here.
    env_file:
      - .env
    environment:
      # The only override: inside the compose network Redis is reachable at
      # the service name "redis", not localhost, so this replaces whatever
      # FLOAK_REDIS_URL is set to for local (non-Docker) runs.
      FLOAK_REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 20s
      timeout: 8s
      retries: 3
      start_period: 10s

  simulator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: floakmap-simulator
    profiles: ["demo"]
    command: ["python", "/app/tools/simulate_fleet.py", "--api", "http://backend:8000"]
    volumes:
      - ../tools:/app/tools:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # PostGIS + TimescaleDB. Run with `--profile db` to persist events.
  db:
    image: timescale/timescaledb-ha:pg16
    container_name: floakmap-db
    profiles: ["db"]
    env_file:
      - .env.db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-floak}
      POSTGRES_DB: ${POSTGRES_DB:-floakmap}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Web UI for Postgres. http://localhost:5050
  # Login with PGADMIN_DEFAULT_EMAIL / PGADMIN_DEFAULT_PASSWORD below.
  # A server pointing at the db service is pre-registered via servers.json.
  pgadmin:
    image: dpage/pgadmin4:8
    container_name: floakmap-pgadmin
    profiles: ["db"]
    env_file:
      - .env.db
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@floak.demo}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-floakadmin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./db/pgadmin_servers.json:/pgadmin4/servers.json:ro
      - ./db/pgadmin_pgpass:/pgadmin4/pgpass:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  pgadmin_data:
